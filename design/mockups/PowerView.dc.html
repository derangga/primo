<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Purchasing Power view</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./components.css">
<script src="./provinces.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="fpm app" data-theme="{{theme}}">

<svg width="0" height="0" style="position: absolute" aria-hidden="true"><defs>
<symbol id="i-down" viewBox="0 0 14 14"><path d="M3 5.5l4 4 4-4"></path></symbol>
<symbol id="i-left" viewBox="0 0 14 14"><path d="M8.5 3l-4 4 4 4"></path></symbol>
<symbol id="i-right" viewBox="0 0 14 14"><path d="M5.5 3l4 4-4 4"></path></symbol>
<pattern id="fpm-hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" style="fill: var(--bucket-nodata)"></rect><line x1="0" y1="0" x2="0" y2="5" style="stroke: var(--bucket-hatch); stroke-width: 1.5"></line></pattern>
<symbol id="i-sun" viewBox="0 0 14 14"><circle cx="7" cy="7" r="2.6"></circle><path d="M7 1v1.5M7 11.5V13M1 7h1.5M11.5 7H13M2.8 2.8l1 1M10.2 10.2l1 1M2.8 11.2l1-1M10.2 3.8l1-1"></path></symbol>
<symbol id="i-moon" viewBox="0 0 14 14"><path d="M11.5 8.2A5 5 0 0 1 5.8 2.5a5 5 0 1 0 5.7 5.7z"></path></symbol>
<symbol id="i-system" viewBox="0 0 14 14"><rect x="1.5" y="2.5" width="11" height="7.5" rx="1.2"></rect><path d="M5 12.5h4M7 10v2.5"></path></symbol>
<symbol id="i-nav-map" viewBox="0 0 14 14"><path d="M1.5 3.5l3.5-1.5 4 1.5 3.5-1.5v8.5l-3.5 1.5-4-1.5-3.5 1.5zM5 2v9M9 3.5v9"></path></symbol>
<symbol id="i-nav-chart" viewBox="0 0 14 14"><path d="M1.5 12.5h11M2 9.5l3-3 2.5 2 4-4.5"></path></symbol>
<symbol id="i-nav-power" viewBox="0 0 14 14"><path d="M3 5h8l-.8 7.5H3.8zM5 5V4a2 2 0 0 1 4 0v1"></path></symbol>
</defs></svg>

<header class="hdr">
<div class="hdr-title">Food Price Monitor</div>
<nav class="tabs" aria-label="Views"><a class="tab" href="MapView.dc.html"><svg class="ic only-narrow"><use href="#i-nav-map"></use></svg>Map</a><a class="tab" href="ChartView.dc.html"><svg class="ic only-narrow"><use href="#i-nav-chart"></use></svg>Chart</a><a class="tab is-selected" href="PowerView.dc.html"><svg class="ic only-narrow"><use href="#i-nav-power"></use></svg>Purchasing Power</a></nav>
<div class="badge hdr-end"><span class="dot"></span><span>Data <b>7 Oct 2026</b></span></div>
<button type="button" class="iconbtn is-round" aria-label="Theme: {{themeName}}"><svg class="ic"><use href="{{themeIcon}}"></use></svg></button>
</header>

<main class="page">

<div class="filters">
<div class="field"><span class="overline">Commodity</span><button type="button" class="ctl" style="width: 280px"><span>Beras</span><svg class="ic"><use href="#i-down"></use></svg></button></div>
<div class="field"><span class="overline">Date</span>
<div class="datectl"><button type="button" class="iconbtn" aria-label="Previous date"><svg class="ic"><use href="#i-left"></use></svg></button><button type="button" class="ctl" style="width: 176px"><span>Wed, 7 Oct 2026</span><svg class="ic"><use href="#i-down"></use></svg></button><button type="button" class="iconbtn is-disabled" disabled aria-label="Next date"><svg class="ic"><use href="#i-right"></use></svg></button><button type="button" class="btn is-disabled" disabled style="margin-left: 4px">Latest</button></div>
</div>
</div>

<div class="cols is-power">

<section class="card" aria-label="Ranking" style="padding: 16px 10px">
<div class="card-head" style="padding: 0 6px"><span class="card-title">Beras one UMP 2026 buys</span><span class="small muted">kg, 34 provinces</span></div>
<div style="position: relative">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="34">
<div class="rank"><span class="rank-name">{{r.name}}</span><div><div class="rank-bar {{r.cls}}" style="width: {{r.w}}"></div></div><span class="rank-val">{{r.val}}</span></div>
</sc-for>
<div class="rank rank-median"><span></span><div style="position: relative"><i style="left: {{medianLeft}}"></i></div><span></span></div>
</div>
<sc-for list="{{missing}}" as="m" hint-placeholder-count="1">
<div class="rank is-nodata"><span class="rank-name">{{m.name}}</span><div class="muted">No data</div><span class="rank-val"></span></div>
</sc-for>
<div class="small muted" style="padding: 8px 6px 0; display: flex; align-items: center; gap: 8px"><i style="display: block; width: 1px; height: 14px; background: var(--color-text)"></i>{{medianLabel}}</div>
</section>

<section class="card first-narrow" aria-label="Purchasing power map">
<div class="card-head"><span class="card-title">Relative to the median province</span><span class="small muted">7 Oct 2026</span></div>
<svg class="map" viewBox="0 0 1000 377" role="img" aria-label="Map of Indonesia's 34 provinces coloured by purchasing power bucket">
<path class="pf1" d="{{d1}}"></path>
<path class="pf2" d="{{d2}}"></path>
<path class="pf3" d="{{d3}}"></path>
<path class="pf4" d="{{d4}}"></path>
<path class="pf5" d="{{d5}}"></path>
<path class="pfn" d="{{dN}}"></path>
</svg>
<div class="legend-row">
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; justify-content: space-between; font-size: 11px; color: var(--color-text-2)"><span>Buys less</span><span>Buys more</span></div>
<div class="strip"><i class="b5" style="border-radius: 3px 0 0 3px"></i><i class="b4"></i><i class="b3"></i><i class="b2"></i><i class="b1" style="border-radius: 0 3px 3px 0"></i></div>
<div class="ticks"><span>−15%</span><span>−5%</span><span>+5%</span><span>+15%</span><span></span></div>
</div>
<div class="legend" style="padding-top: 16px"><span><i class="sw nd"></i>No data</span></div>
</div>
</section>

</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":1260}}'>
class Component extends DCLogic {
renderVals() {
var geo = (window.FPM_GEO && window.FPM_GEO.provinces) || [];
// Kilograms of Beras one UMP 2026 buys. Only JK (338) and JI (160) are from the brief, the rest are illustrative. null is no data.
var KG = { JK: 338, SN: 262, BB: 240, SA: 235, AC: 230, SS: 228, KI: 225, KU: 222, RI: 220, KR: 218, PA: 216, SU: 215, KS: 212, KT: 210, JA: 208, PB: 205, GO: 200, SG: 198, BA: 196, ST: 195, MU: 190, BT: 188, NB: 187, SB: 186, MA: 185, LA: 184, KB: 180, BE: 170, JI: 160, NT: 150, YO: 145, JB: 140, JT: 138, SR: null };
var have = geo.filter(function (p) { return KG[p.id] != null; }).sort(function (a, b) { return KG[b.id] - KG[a.id]; });
var sorted = have.map(function (p) { return KG[p.id]; });
var median = sorted.length ? sorted[Math.floor(sorted.length / 2)] : 1;
var max = sorted[0] || 1;
// Bucket 1 is good for the buyer, so a high value maps to 1 here.
var bucket = function (v) { var r = v / median - 1; return r > 0.15 ? 1 : r > 0.05 ? 2 : r >= -0.05 ? 3 : r >= -0.15 ? 4 : 5; };
var B = {};
have.forEach(function (p) { B[p.id] = bucket(KG[p.id]); });
var d = function (n) { return geo.filter(function (p) { return (B[p.id] || 0) === n; }).map(function (p) { return p.d; }).join(''); };
return {
theme: this.props.theme || 'light',
themeIcon: this.props.theme === 'dark' ? '#i-moon' : '#i-sun',
themeName: this.props.theme === 'dark' ? 'Dark' : 'Light',
rows: have.map(function (p) { return { name: p.name, val: KG[p.id] + ' kg', w: (KG[p.id] / max * 100).toFixed(1) + '%', cls: 'b' + B[p.id] }; }),
missing: geo.filter(function (p) { return KG[p.id] == null; }).map(function (p) { return { name: p.name }; }),
medianLeft: (median / max * 100).toFixed(1) + '%',
medianLabel: 'Median province, ' + median + ' kg',
d1: d(1), d2: d(2), d3: d(3), d4: d(4), d5: d(5), dN: d(0)
};
}
}
</script>
</body>
</html>
